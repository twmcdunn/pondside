schema = 1
id     = "decimate"
kind   = "effect"
gloss  = "Sample-rate reduction (bit-crusher grit)"
tags   = ["lofi", "crush", "digital", "aliasing", "grit"]

[sc]
name     = "decimate"
usage    = """
// at a cue: the performer through it
~decimate = Synth(\\lx_decimate_mono, [\\in, ~live, \\mix, 1], addAction: \\addToTail);
~decimate.set(\\mix, 0.5);   // later
// on a pattern
~lx[\\withFx].(~pat, [[\\decimate, (mix: 0.4)]]).play;"""

[params.mix]
default = 1
doc     = "0 dry .. 1 wet"

[params.factor]
default = 4
doc     = "Divide the sample rate by this (1 = clean)"

[params.antiAlias]
default = 0
doc     = "0..1 low-pass before"

[params.antiImage]
default = 0
doc     = "0..1 low-pass after"
