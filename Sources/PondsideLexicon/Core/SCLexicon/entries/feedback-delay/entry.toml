schema = 1
id     = "feedback-delay"
kind   = "effect"
gloss  = "Feedback delay (echoes) with damping"
tags   = ["delay", "echo", "repeat", "feedback"]

[sc]
name     = "fbDelay"
usage    = """
// at a cue: the performer through it
~fbDelay = Synth(\\lx_fbDelay_mono, [\\in, ~live, \\mix, 1], addAction: \\addToTail);
~fbDelay.set(\\mix, 0.5);   // later
// on a pattern
~lx[\\withFx].(~pat, [[\\fbDelay, (mix: 0.4)]]).play;"""

[params.mix]
default = 0.4
doc     = "0 dry .. 1 wet"

[params.time]
default = 0.375
doc     = "Delay time, s (0..4)"

[params.fb]
default = 0.5
doc     = "Feedback 0..0.95: how many echoes"

[params.damp]
default = 5000
doc     = "Low-pass in the loop, Hz: each echo darker"
