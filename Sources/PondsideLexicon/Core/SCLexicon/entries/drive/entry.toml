schema = 1
id     = "drive"
kind   = "effect"
gloss  = "Soft-clipping distortion with a tone control"
tags   = ["distortion", "saturation", "dirty", "overdrive", "harsh"]

[sc]
name     = "drive"
usage    = """
// at a cue: the performer through it
~drive = Synth(\\lx_drive_mono, [\\in, ~live, \\mix, 1], addAction: \\addToTail);
~drive.set(\\mix, 0.5);   // later
// on a pattern
~lx[\\withFx].(~pat, [[\\drive, (mix: 0.4)]]).play;"""

[params.mix]
default = 1
doc     = "0 dry .. 1 wet"

[params.gain]
default = 4
doc     = "Drive into tanh (1 clean .. 50 fuzzy)"

[params.tone]
default = 6000
doc     = "Low-pass after the drive, Hz"
